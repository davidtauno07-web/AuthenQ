services:
  postgres:
    image: postgres:16-alpine
    container_name: authenq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authenq
      POSTGRES_PASSWORD: authenq
      POSTGRES_DB: authenq
    ports:
      - "5432:5432"
    volumes:
      - authenq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authenq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authenq-pgdata:
