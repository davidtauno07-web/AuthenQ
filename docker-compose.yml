# Local infrastructure for AuthenQ. PostgreSQL is the only required service:
# jobs, locks and rate limits use PostgreSQL by default, and object storage
# defaults to the local filesystem driver. Redis and S3-compatible storage are
# optional and enabled through environment variables.
services:
  postgres:
    image: postgres:16-alpine
    container_name: authenq-postgres
    environment:
      POSTGRES_USER: authenq
      POSTGRES_PASSWORD: authenq
      POSTGRES_DB: authenq
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authenq']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: authenq-minio
    profiles: ['s3']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: authenq
      MINIO_ROOT_PASSWORD: authenq-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
