name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: authenq_test
          POSTGRES_USER: authenq
          POSTGRES_PASSWORD: authenq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authenq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://authenq:authenq@localhost:5432/authenq_test?schema=public
      JWT_SECRET: authenq-ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
